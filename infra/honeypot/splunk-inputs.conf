# Splunk Universal Forwarder inputs for the honeypot (Phase 0A, Task 8)
#
# Deploy on vm-honeypot-win into the UF's etc/system/local/inputs.conf
# (or a dedicated app's local/). Pair with Splunk_TA_microsoft_sysmon on the
# indexer/search head for Sysmon field extraction (matches the v1/v2 Splunk setup).
#
# Telemetry path (Option A): the UF's outputs.conf points at Splunk's PUBLIC IP
# 20.236.193.253:9997 (NOT the private 10.0.0.5 — denied by the honeypot NSG).
# Everything below lands in the dedicated `honeypot` index.

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = honeypot
renderXml = 1

[WinEventLog://Security]
disabled = 0
index = honeypot

[WinEventLog://System]
disabled = 0
index = honeypot
