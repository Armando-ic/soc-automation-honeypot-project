[project]
name = "red-team"
version = "0.1.0"
description = "Production-faithful adversarial red-team harness for the honeypot triage pipeline (Phase 1)"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40", "pyyaml>=6.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0", "isort>=5.13", "mypy>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["red_team*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
