# Run from the repo root:
#   docker network create soar-net          # once (external network, shared with n8n)
#   docker compose -f grounding-service/docker-compose.yml up -d --build
name: soar
services:
  qdrant:
    image: qdrant/qdrant:latest          # pin to the pulled digest for reproducibility (see plan Task 5)
    container_name: qdrant
    restart: unless-stopped
    networks: [soar-net]
    volumes:
      - qdrant_storage:/qdrant/storage

  grounding-service:
    container_name: grounding-service
    restart: unless-stopped
    build:
      context: ..                          # repo root, so triage-verifier/ is in context
      dockerfile: grounding-service/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      RUNS_PATH: /data/runs.jsonl
      # 0D-2 Falcon poller state + AID-pin guard. State persists on the grounding_runs volume
      # (survives container recreate + VM deallocate). FALCON_PINNED_AID is interpolated from the
      # gitignored grounding-service/.env (same mechanism as ANTHROPIC_API_KEY); unset => contain-guard
      # always 409s (fail-safe). The pinned AID NEVER lives in this committed file or in n8n.
      FALCON_STATE_PATH: /data/falcon-poller-state.json
      FALCON_PINNED_AID: ${FALCON_PINNED_AID:-}
      FALCON_POLL_CAP: "8"
      # Live advisory judge (Phase 2): interpolated from a gitignored .env that MUST sit next to THIS
      # compose file (grounding-service/.env). Compose loads the interpolation .env from the compose
      # file's directory, NOT the dir you invoke it from — a repo-root .env is silently ignored.
      # Unset/empty => StubJudge. The value never lives in this committed file.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Phase 4 /investigate: the read-only Splunk connection + the investigation loop. The
      # non-secret values are literals (private VNet mgmt endpoint, the read-only role user);
      # SPLUNK_PASSWORD is interpolated from the SAME gitignored grounding-service/.env as
      # ANTHROPIC_API_KEY and never lives in this committed file. main.py gates the splunk
      # service factory on SPLUNK_HOST, so unsetting it => /investigate returns
      # splunk_not_configured (fail-safe), never a crash.
      SPLUNK_HOST: 10.0.0.5
      SPLUNK_PORT: "8089"
      SPLUNK_SCHEME: https
      SPLUNK_USERNAME: phase4_investigator
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-}
      INVESTIGATE_ENABLED: "1"
      INVESTIGATE_LIVE_INDEXES: honeypot
      # Honeypot-opening auto-brake (Part A): inert by default (BRAKE_ENABLED unset =>
      # brake_factory is None in main.py, so /brake/nsg-deny and /brake/nsg-status stay
      # dead-but-safe). AZURE_CLIENT_SECRET is interpolated from the SAME gitignored
      # grounding-service/.env as ANTHROPIC_API_KEY/SPLUNK_PASSWORD and never lives in
      # this committed file. The SP is scoped to ONLY the honeypot NSG (spec section 3.6).
      BRAKE_ENABLED: ${BRAKE_ENABLED:-false}
      SPLUNK_HOST_IP: ${SPLUNK_HOST_IP:-}
      # 150/400 decided 2026-07-16 (see config.py). They move as a PAIR: 400 keeps egress_rate
      # dead (2*150 <= 400); raising the fan-out gate alone would resurrect the un-baselined rate
      # rule below it. If .env overrides one, it must override both to preserve the invariant.
      BRAKE_DISTINCT_DST_MAX: ${BRAKE_DISTINCT_DST_MAX:-150}
      BRAKE_CONN_RATE_MAX: ${BRAKE_CONN_RATE_MAX:-400}
      # Feeder liveness watermark. MUST live on /data (the grounding_runs volume), not the
      # config default of cwd: the deploy step is `up -d --build --force-recreate`, so a
      # cwd-local file resets total_posts to 0 on every deploy and reads STALE forever -- i.e.
      # exactly like a dead feeder. Same reasoning as FALCON_STATE_PATH above.
      # NOTE: BRAKE_ENABLED=false does NOT make the brake inert, it only gates the NSG half.
      # /brake/nsg-deny returns 200 {"fired": false}, n8n reads 200 as success and walks on to
      # the Falcon chain, and /falcon/contain-guard gates on FALCON_PINNED_AID alone. Silencing
      # BOTH layers takes BOTH switches. There is no observe-only mode.
      BRAKE_FEED_STATE_PATH: /data/brake-feed-state.json
      BRAKE_FEED_STALE_S: ${BRAKE_FEED_STALE_S:-300}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      HONEYPOT_SUBSCRIPTION_ID: ${HONEYPOT_SUBSCRIPTION_ID:-}
      HONEYPOT_NSG_RG: ${HONEYPOT_NSG_RG:-}
      HONEYPOT_NSG_NAME: ${HONEYPOT_NSG_NAME:-}
      HONEYPOT_NSG_DENY_RULE: ${HONEYPOT_NSG_DENY_RULE:-honeypot-brake-egress-deny}
      HONEYPOT_NSG_DENY_PRIORITY: ${HONEYPOT_NSG_DENY_PRIORITY:-100}
    volumes:
      - grounding_runs:/data
    depends_on: [qdrant]
    networks: [soar-net]

networks:
  soar-net:
    external: true                         # created manually so the pre-existing n8n can join it too

volumes:
  qdrant_storage:
  grounding_runs:
