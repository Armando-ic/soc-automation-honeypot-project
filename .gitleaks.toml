# gitleaks config — extends the default ruleset with path-scoped allowlists for
# vendored upstream artifacts whose EXAMPLE data trips the generic-api-key detector.
#
# Why this file exists:
#   (1) The DFIR-Iris OpenAPI specification at JSON/IRIS-2.0.4-OpenAPI-specification.json
#   is an upstream-published artifact (vendored verbatim from the dfir-iris/iris-web
#   project's API docs). It contains example tokens inside response-body schemas — placeholder
#   data shipped publicly by the upstream maintainers, not real credentials belonging
#   to this project. Without an allowlist, gitleaks' generic-api-key detector matches
#   those example tokens as if they were live secrets.
#
#   (2) JSON/Analyze_Crowdstrike_detections.json is the official CrowdStrike n8n template
#   (vendored upstream). Its example detection payloads embed file-analysis fields such as
#   "authentihash" (a 64-hex Authenticode FILE HASH, e.g. line 1650) surrounded by other
#   sample VirusTotal fields (reputation, total_votes, detectiteasy). gitleaks' generic-api-key
#   ENTROPY heuristic matches that file hash as if it were an API key — it is not. The template's
#   real n8n credentials are referenced by credential-ID, never by value, so the file holds no
#   live secret. Verified: the matched string is a SHA-256-shaped file hash in example data.
#
# Verification that this is safe to allowlist:
#   - The matched tokens (e.g. "ViYIIkN_LL062yNOcq2kJA3ZMscOAoHmLy8GEh_JYKBWwspLB_E65jhYLg9CsR0J-kP8DmmM3RO31_xixrG8rw"
#     at lines 42055 + 42077) appear inside response-example blocks surrounded by
#     other placeholder fields: user_name "strsinsg", user_email "stringa", id 4, etc.
#   - They differ from the project's actual IRIS API key (which starts <redacted-key-prefix>…
#     and lives only in the gitignored SOC-Automation-Project.md, never committed).
#   - trufflehog v3.95.3 (targeted detectors, not regex/entropy heuristics) reports
#     0 findings against the full git history of this repo.
#
# Scope:
#   Path allowlist applies ONLY to this single file. All other gitleaks rules
#   remain active across the rest of the repo.

[extend]
useDefault = true

[allowlist]
description = "Vendored upstream artifacts with example tokens/hashes (not real credentials)"
paths = [
  '''JSON/IRIS-2\.0\.4-OpenAPI-specification\.json''',
  '''JSON/Analyze_Crowdstrike_detections\.json''',
]
